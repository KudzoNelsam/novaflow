services:
  postgres:
    image: postgres:16
    container_name: novaflow_container
    environment:
      POSTGRES_DB: novaflow
      POSTGRES_USER: novaflow
      POSTGRES_PASSWORD: novaflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
